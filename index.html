  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === lifeTab);
  const lv = levelOf(LF.xp);
  $("lifesub").textContent = `Nv. ${lv} · ${titleOf(lv)}`;
  ({ estado: tabEstado, vestidor: tabVestidor, logros: tabLogros, ajustes: tabAjustes }[lifeTab] || tabEstado)(body);
}
function tabEstado(body) {
  const R = estadoRefs = { stats: {}, tsig: "", tvals: [] };
  const c1 = mk("div", "card pixbox");
  const head = mk("div", "lvl"); R.lvl = mk("b"); R.xptxt = mk("span", "sub");
  head.append(R.lvl, R.xptxt);
  R.xp = meterEl(); R.xp.style.margin = "5px 0 4px"; R.xp.classList.add("good");
  R.days = mk("div", "sub");
  c1.append(head, R.xp, R.days);
  const c2 = mk("div", "card pixbox"); c2.append(mk("div", "sech", "COMO ESTOY"));
  const acts = {
    hunger: ["Comida", "PESCADO", () => { if (FISH.length < 3) dropFish(clamp(catCX() + rand(-14, 14), 4, SW - 10), 1); }],
    fun: ["Diversión", "PELOTA", () => { if (!BALL.active) { toggleBall(); $("t-ball").classList.add("on"); } else say("¡Ya estamos jugando!", 1200); }],
    love: ["Cariño", "MIMAR", cuddle],
  };
  for (const [k, [label, btn, fn]] of Object.entries(acts)) {
    const row = mk("div", "stat"), m = meterEl(), b = mk("button", "px-btn sm", btn);
    b.onclick = fn;
    row.append(mk("span", "lbl", label), m, b);
    R.stats[k] = m; c2.append(row);
  }
  const c3 = mk("div", "card pixbox"); c3.append(mk("div", "sech", "AVISOS"));
  const br = mk("div", "btnrow");
  for (const [label, fn] of [["5 MIN", () => timerReply({ ms: 5 * 60e3, label: "" })], ["10 MIN", () => timerReply({ ms: 10 * 60e3, label: "" })], ["25 MIN", () => timerReply({ ms: 25 * 60e3, label: "" })], [LF.pomo ? "PARAR POMODORO" : "POMODORO", () => { if (LF.pomo) stopPomo(); else startPomo(); renderLife(); }]]) {
    const b = mk("button", "px-btn sm", label);
    b.onclick = () => { fn(); if (lifeTab === "estado") { R.tsig = ""; refreshEstado(); } };
    br.append(b);
  }
  R.tbox = mk("div"); R.tbox.style.marginTop = "6px";
  c3.append(br, R.tbox, mk("div", "sub", "También puedes escribirme: «avísame en 10 minutos de la pizza»."));
  body.append(c1, c2, c3);
  refreshEstado();
}
function refreshEstado() {
  const R = estadoRefs; if (!R) return;
  const lv = levelOf(LF.xp), lo = xpAt(lv), hi = xpAt(lv + 1);
  R.lvl.textContent = `NIVEL ${lv} · ${titleOf(lv).toUpperCase()}`;
  R.xptxt.textContent = `${Math.floor(LF.xp - lo)}/${Math.ceil(hi - lo)}`;
  setMeter(R.xp, ((LF.xp - lo) / (hi - lo)) * 100); R.xp.classList.remove("low");
  R.days.textContent = `${LF.days || 1} ${LF.days === 1 ? "día" : "días"} juntas · racha de ${LF.streak || 1}`;
  for (const [k, m] of Object.entries(R.stats)) setMeter(m, LF[k]);
  const rows = [];
  if (LF.pomo) rows.push({ id: "pomo", label: "Pomodoro · " + (LF.pomo.phase === "work" ? "foco" : "descanso"), end: LF.pomo.end });
  for (const t of LF.timers) rows.push({ id: t.id, label: t.label || "Temporizador " + fmtDur(t.total), end: t.end });
  const sig = rows.map((r) => r.id).join(",");
  if (sig !== R.tsig) {
    R.tsig = sig; R.tbox.textContent = ""; R.tvals = [];
    if (!rows.length) R.tbox.append(mk("div", "sub", "Nada en marcha."));
    for (const r of rows) {
      const row = mk("div", "trow"), tt = mk("span", "tt");
      row.append(mk("span", "tl", r.label), tt);
      if (r.id !== "pomo") { const x = mk("button", "ibtn", ""); x.innerHTML = icon("close", 1); x.style.cssText = "width:15px;height:15px;flex:none"; x.onclick = () => { cancelTimer(r.id); R.tsig = ""; refreshEstado(); }; row.append(x); }
      R.tbox.append(row); R.tvals.push([tt, r.end]);
    }
  }
  for (const [tt, end] of R.tvals) tt.textContent = fmtClock(end - Date.now());
}
function tabVestidor(body) {
  const lv = levelOf(LF.xp);
  const top = mk("div", "card pixbox");
  top.append(mk("div", "sub", "Más accesorios al subir de nivel (ahora eres nivel " + lv + ")."));
  const b = mk("button", "px-btn sm", "CAMBIAR PELAJE"); b.style.marginTop = "6px"; b.onclick = () => openSkins();
  top.append(b);
  const grid = mk("div", "hatgrid");
  for (const h of HATS) {
    const locked = lv < h.lvl;
    const card = mk("button", "hatcard" + (locked ? " locked" : "") + (hatId === h.id ? " sel" : ""));
    const cv = document.createElement("canvas"); cv.width = PW; cv.height = PH;
    try { renderPreview(cv, skinId, h.id); } catch {}
    card.append(cv, mk("span", null, h.name));
    if (locked) card.append(mk("span", "lk", "NV." + h.lvl));
    card.onclick = () => {
      if (locked) { Sfx.sad(); say(`Necesito nivel ${h.lvl} para ponerme eso`, 1600); return; }
      chooseHat(h.id); renderLife();
    };
    grid.append(card);
  }
  body.append(top, grid);
}
function tabLogros(body) {
  const n = ACHS.filter((a) => LF.ach[a[0]]).length;
  const c = mk("div", "card pixbox"); c.append(mk("div", "sech", `LOGROS ${n}/${ACHS.length}`));
  const sorted = [...ACHS].sort((a, b) => (LF.ach[b[0]] ? 1 : 0) - (LF.ach[a[0]] ? 1 : 0));
  for (const [id, name, desc] of sorted) {
    const done = !!LF.ach[id];
    const row = mk("div", "achrow" + (done ? "" : " lock"));
    const tx = mk("div"); tx.append(mk("div", "nm", name), mk("div", "sub", desc));
    row.append(mk("span", "st", done ? "★" : "☆"), tx);
    c.append(row);
  }
  body.append(c);
}
function tabAjustes(body) {
  const c = mk("div", "card pixbox"); c.append(mk("div", "sech", "AJUSTES"));
  const row = (title, sub, ctrl) => { const r = mk("div", "setrow"), tx = mk("div", "tx"); tx.append(mk("div", null, title), mk("div", "sub", sub)); r.append(tx, ctrl); c.append(r); };
  const sel = document.createElement("select");
  for (const [id, p] of Object.entries(PERSONAS)) { const o = mk("option", null, p.name); o.value = id; sel.append(o); }
  sel.value = LF.persona;
  const sub = mk("div", "sub", PERSONAS[LF.persona].desc);
  sel.onchange = () => { LF.persona = sel.value; saveLife(); sub.textContent = PERSONAS[LF.persona].desc; Sfx.pop(); say(pick(["¡Cambio de look mental!", "Vale, seré " + PERSONAS[LF.persona].name.toLowerCase()]), 1600); };
  const r0 = mk("div", "setrow"), tx0 = mk("div", "tx"); tx0.append(mk("div", null, "Personalidad"), sub); r0.append(tx0, sel); c.append(r0);
  const tog = (get, set) => { const b = mk("button", "tog" + (get() ? " on" : ""), get() ? "SÍ" : "NO"); b.onclick = async () => { await set(!get()); b.className = "tog" + (get() ? " on" : ""); b.textContent = get() ? "SÍ" : "NO"; Sfx.pop(); }; return b; };
  row("Hablar en voz alta", TTS.ok ? "Lee sus respuestas con la voz del sistema" : "Tu sistema no lo permite", tog(() => LF.voice, (v) => { LF.voice = v && TTS.ok; if (!LF.voice) stopSpeaking(); saveLife(); }));
  row("Avisos de descanso", "Te recuerda estirarte y beber agua cada ~50 min", tog(() => LF.breaks, (v) => { LF.breaks = v; saveLife(); }));
  if (IS_APP && window.api && api.getAutostart) {
    let auto = false;
    const b = tog(() => auto, async (v) => { try { auto = !!(await api.setAutostart(v)); } catch {} });
    api.getAutostart().then((v) => { auto = !!v; b.className = "tog" + (auto ? " on" : ""); b.textContent = auto ? "SÍ" : "NO"; }).catch(() => {});
    row("Abrir con el ordenador", "Mochi aparece sola al iniciar sesión", b);
  }
  const t = mk("div", "card pixbox"); t.append(mk("div", "sech", "TRUCOS"));
  t.append(mk("div", "sub", "Escribe /ayuda en el chat para ver los comandos. Arrastra un archivo de texto sobre Mochi para que lo lea, o pulsa el botón del portapapeles."));
  body.append(c, t);
}

/* ---- Bucle de vida (cada segundo) ---- */
let lastTick = Date.now();
function tickLife() {
  const nowMs = Date.now(), dm = Math.min(5, Math.max(0, (nowMs - lastTick) / 60000)); lastTick = nowMs;
  const sl = P.sleeping ? 0.35 : 1;
  LF.hunger = clamp(LF.hunger - dm * 0.8 * sl, 0, 100);
  LF.fun = clamp(LF.fun - dm * 0.6 * sl, 0, 100);
  LF.love = clamp(LF.love - dm * 0.45 * sl, 0, 100);
  tickTimers(nowMs);
  if (nowMs - lastSave > 15000) saveLife();
  if (estadoRefs && winEl.classList.contains("life")) refreshEstado();
}
setInterval(tickLife, 1000);

$("clip").onclick = askClipboard;
/* =====================================================================
   ARRANQUE
   ===================================================================== */
applySkin(skinId);
setSending(false);
(async function start() {
  if (IS_APP) {
    try {
      const st = await api.getState();
      if (st && st.mode === "mini") { curMode = "mini"; winEl.classList.add("mini"); document.body.classList.add("mini"); }
      $("b-pin").classList.toggle("on", !!(st && st.pinned));
    } catch {}
  }
  layout();
  updateTod(); setInterval(updateTod, 60000);
  const firstToday = dailyVisit(); checkAch(); saveLife(); updateChip();
  setTimeout(() => tickTimers(Date.now()), 1500);
  setTimeout(() => {
    if (winEl.classList.contains("setup") || P.mode !== "idle" || P.sleeping) return;
    if (LF.awayMin > 360) say("¡Por fin has vuelto! Te echaba de menos ♥", 3200);
    else if (LF.hunger < 30) say("Tengo un poco de hambre... ¿me das un pescadito?", 3400);
    else if (firstToday && LF.days > 1) say(`¡Ya son ${LF.days} días juntas! ♥`, 2800);
  }, 4300);
  requestAnimationFrame(frame);
  setTimeout(() => {
    waveFor(1500); express({ mouth: "smile" }, 1500);
    const nameMem = memOn && memory.find((m) => /^se llama /i.test(m.text));
    const who = nameMem ? ", " + nameMem.text.replace(/^se llama /i, "").replace(/\.$/, "") : "";
    const g = greetText();
    say(g.startsWith("¿") ? g.replace("?", who + "?") : g.replace(/!$/, who + "!"), 2400);
  }, 400);
  if (load("mochi.fishtip") !== "1") {
    setTimeout(() => { if (!winEl.classList.contains("setup") && P.mode === "idle") { save("mochi.fishtip", "1"); say("Psst... haz clic en el suelo rosa y me das un pescadito ♥", 3500); } }, 6000);
  }
  boot();
})();

// Para depurar desde la consola: __mochi.react("tail"), __mochi.sleep() ...
window.__mochi = {
  react: (zone) => onPetClick(zone), dizzy, sleep: () => { P.lastInteract = -1e9; goSleep(); }, wake: () => wakeUp(),
  jump: () => spinJump(), wave: () => waveFor(1500), setMode, skin: applySkin, express, say, state: P,
  memory: () => memory, openMemory, systemPrompt: () => buildSystemPrompt(),
  fish: (x, y) => dropFish(x, y), butterfly: spawnButterfly, dance, sneeze, groom, chaseTail,
  typing: (on) => { KB.ai = !!on; }, kb: KB,
  bonk, ball: BALL, toggleBall, openSkins, chooseSkin, skins: SKIN_ORDER,
  throwBall: (x, y, vx, vy) => Object.assign(BALL, { x, y, vx, vy, held: false }),
  catX: () => catCX(),
  life: LF, Life, HATS, chooseHat, openLife, parseDuration, handleCommand, addTimer, tickTimers, startPomo, pomoAdvance,
  readBook, sipCoffee, knead, stretch, shootingStar, rumble, bored, lonely, setContext, askAbout, onSysIdle, levelOf, ACHS, checkAch,
  setTod: (t) => { TOD = t; stage.dataset.tod = t; },
};
