<style>
  :root {
    --ink: #3b2a4a;
    --ink-soft: #7a6888;
    --bg: #fff0f5;
    --bg2: #ffe4ee;
    --pink: #ff8fab;
    --pink-dark: #e0577f;
    --cream: #ffe8d6;
    --mint: #c9f2e3;
    --white: #ffffff;
    --title: "Press Start 2P", "Courier New", monospace;
    --body: "Pixelify Sans", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--body);
    font-size: 14px;
    color: var(--ink);
    padding: 3px 7px 7px 3px;
    user-select: none;
    -webkit-font-smoothing: none;
  }
  body.mini { padding: 0; }
  button { font-family: inherit; }

  /* Caja con esquinas pixeladas (estilo NES) */
  .pixbox {
    box-shadow:
      0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink),
      -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink),
      0 6px 0 0 rgba(59, 42, 74, .18);
    margin: 3px;
  }

  .app {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%),
      linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }

  /* ---------- Barra de título ---------- */
  .titlebar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    height: 26px; flex: none;
    padding: 0 4px 0 7px;
    background: var(--pink);
    border-bottom: 3px solid var(--ink);
    -webkit-app-region: drag;
  }
  .brand { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink); }
  .brand .name { font-family: var(--title); font-size: 9px; letter-spacing: 1px; padding-top: 2px; }
  .brand .mood { font-size: 12px; color: var(--white); text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbtns { display: flex; gap: 3px; -webkit-app-region: no-drag; }
  .ibtn {
    width: 19px; height: 19px; padding: 0;
    display: grid; place-items: center;
    color: var(--ink); background: var(--cream);
    border: 2px solid var(--ink); cursor: pointer;
  }
  .ibtn:hover { background: var(--white); }
  .ibtn:active { transform: translate(1px, 1px); }
  .ibtn.on { background: var(--mint); }
  .ibtn.close:hover { background: #ffb3b3; }
  .ibtn svg { display: block; }

  /* ---------- Escenario de la mascota ---------- */
  .stage {
    position: relative; flex: none; height: 120px; overflow: hidden;
    border-bottom: 3px solid var(--ink);
    background:
      linear-gradient(to bottom, transparent 78%, rgba(255, 143, 171, .22) 78%, rgba(255, 143, 171, .22) 80%, rgba(255, 143, 171, .12) 80%);
  }
  .stage canvas { position: absolute; image-rendering: pixelated; }
  #bg, #fx { left: 0; top: 0; pointer-events: none; }
  #bg { z-index: 1; }
  #pet { z-index: 2; cursor: grab; transform-origin: 50% 94%; touch-action: none; }
  #pet.dragging { cursor: grabbing; }
  #fx { z-index: 3; }

  /* Bocadillo */
  .bubble {
    position: absolute; z-index: 4;
    max-width: 150px; padding: 5px 8px 6px;
    background: var(--white); color: var(--ink);
    font-size: 13px; line-height: 1.25;
    pointer-events: none;
    opacity: 0; transform: scale(.6);
    transition: opacity .12s steps(2), transform .12s steps(3);
    word-wrap: break-word;
  }
  .bubble.show { opacity: 1; transform: scale(1); }
  .bubble::after { content: ""; position: absolute; background-repeat: no-repeat; background-size: 100% 100%; image-rendering: pixelated; }
  .bubble.tail-left { transform-origin: 0 100%; }
  .bubble.tail-left::after { width: 9px; height: 15px; left: -12px; bottom: 4px; background-image: var(--tail-left); }
  .bubble.tail-right { transform-origin: 100% 100%; }
  .bubble.tail-right::after { width: 9px; height: 15px; right: -12px; bottom: 4px; background-image: var(--tail-right); }
  .bubble.thought.tail-right::after { left: auto; right: -16px; }
  .bubble.tail-down { transform-origin: 50% 100%; }
  .bubble.tail-down::after { width: 15px; height: 9px; left: calc(50% - 7px); bottom: -12px; background-image: var(--tail-down); }
  .bubble.thought::after { width: 14px; height: 10px; left: -16px; bottom: -6px; background-image: var(--tail-thought); }
  .bubble.thought.tail-down::after { left: calc(50% - 7px); bottom: -16px; }
  .bubble.thought { white-space: nowrap; }
  .bubble .dots { display: inline-block; width: 18px; text-align: left; white-space: nowrap; }
  .bubble .dots::after { content: ""; animation: dots 1.2s steps(1) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* Controles flotantes del modo mini */
  .mini-ctrls { position: absolute; top: 4px; right: 4px; z-index: 6; display: none; gap: 3px; }
  .app.mini .mini-ctrls { display: flex; opacity: 0; transition: opacity .15s steps(2); }
  .app.mini:hover .mini-ctrls { opacity: 1; }

  /* ---------- Chat ---------- */
  #chatview { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #log {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 10px 10px 6px;
    display: flex; flex-direction: column; gap: 10px;
    user-select: text;
    scrollbar-width: thin; scrollbar-color: var(--ink) transparent;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--ink); }
  .line { display: flex; gap: 6px; align-items: flex-end; animation: pop .22s steps(3); }
  .line.user { justify-content: flex-end; }
  .line.sys { justify-content: center; }

"use strict";
/* =====================================================================

   ===================================================================== */
const OLLAMA = "http://127.0.0.1:11434";
const PET_NAME = "Mochi";
const SYSTEM_PROMPT =
  `Eres ${PET_NAME}, una asistente virtual con forma de gatita pixel art, tierna y simpática. ` +
  `Responde siempre en el idioma del usuario, de forma clara, amable y breve (máximo unas pocas frases salvo que pidan más detalle). ` +
  `Puedes usar algún kaomoji ocasional como ^_^ pero sin abusar. Si no sabes algo, dilo con honestidad.`;
const MAX_HISTORY = 20;          // mensajes que se reenvían al modelo
const SAVED_MESSAGES = 60;       // mensajes que se guardan entre sesiones
const SLEEP_AFTER_MS = 75000;    // se duerme tras este tiempo sin que le hagas caso
const SCALE = 3;                 // tamaño de cada píxel del sprite
const PW = 40, PH = 36;          // tamaño lógico del sprite

const $ = (id) => document.getElementById(id);
const IS_APP = !!window.api;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now();
function load(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch {} }

/* =====================================================================
   ICONOS PIXEL (SVG generado)
   ===================================================================== */
function pxSvg(rows, colors, cell = 1) {
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  let rects = "";
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    const c = colors[ch];
    if (c) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${c}"/>`;
  }));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w * cell}" height="${h * cell}" shape-rendering="crispEdges">${rects}</svg>`;
}
const svgUri = (s) => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
const ICONS = {
  heart: [".xx.xx.", "xxxxxxx", "xxxxxxx", ".xxxxx.", "..xxx..", "...x..."],

   ===================================================================== */
const Sfx = (() => {
  let ac = null, master = null;
  let muted = load("mochi.muted") === "1";
  function ctx() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch { return null; }
      master = ac.createGain(); master.gain.value = 0.11; master.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  }
  function tone({ type = "square", f0, f1 = f0, dur = 0.1, vol = 0.5, delay = 0, vib = 0 }) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (vib) {
      const l = a.createOscillator(), lg = a.createGain();
      l.frequency.value = vib; lg.gain.value = f0 * 0.05;
      l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur);
    }
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise({ dur = 0.25, vol = 0.3, hp = 2500, delay = 0 }) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + delay;
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; save("mochi.muted", muted ? "1" : "0"); return muted; },
    pop() { tone({ f0: 420, f1: 900, dur: 0.07, vol: 0.35 }); },
    blip() { tone({ f0: rand(420, 700), dur: 0.03, vol: 0.08 }); },
    type() { tone({ type: "triangle", f0: rand(700, 900), dur: 0.025, vol: 0.12 }); },
    meow() {
      tone({ type: "triangle", f0: 560, f1: 920, dur: 0.12, vol: 0.45, vib: 10 });
      tone({ type: "triangle", f0: 920, f1: 480, dur: 0.28, vol: 0.4, delay: 0.11, vib: 10 });
    },
    boing() { tone({ type: "square", f0: 180, f1: 640, dur: 0.15, vol: 0.2 }); },
    land() { tone({ type: "square", f0: 160, f1: 80, dur: 0.06, vol: 0.18 }); },
    chime() { [660, 880, 1320].forEach((f, i) => tone({ type: "triangle", f0: f, dur: 0.14, vol: 0.3, delay: i * 0.07 })); },
    sparkle() { [1320, 1760, 2093].forEach((f, i) => tone({ type: "sine", f0: f, dur: 0.1, vol: 0.18, delay: i * 0.05 })); },
    giggle() { [900, 1050, 950, 1150].forEach((f, i) => tone({ type: "square", f0: f, f1: f * 1.1, dur: 0.05, vol: 0.12, delay: i * 0.08 })); },
    sad() { tone({ type: "triangle", f0: 520, f1: 300, dur: 0.4, vol: 0.35 }); },
    key() { noise({ dur: 0.022, vol: 0.1, hp: 4500 }); tone({ type: "square", f0: rand(1700, 2300), dur: 0.012, vol: 0.035 }); },
    crunch() { for (let i = 0; i < 3; i++) noise({ dur: 0.05, vol: 0.22, hp: 1400, delay: i * 0.1 }); },
    sneeze() { tone({ type: "triangle", f0: 600, f1: 950, dur: 0.16, vol: 0.25 }); noise({ dur: 0.2, vol: 0.28, hp: 1800, delay: 0.17 }); },
    tune() { [523, 659, 784, 659, 587, 698, 880, 784].forEach((f, i) => tone({ type: "triangle", f0: f, dur: 0.14, vol: 0.2, delay: i * 0.2 })); },
    drop() { tone({ type: "sine", f0: 900, f1: 300, dur: 0.18, vol: 0.2 }); },
    bonk() { tone({ type: "square", f0: 330, f1: 110, dur: 0.09, vol: 0.3 }); tone({ type: "sine", f0: 1400, f1: 1300, dur: 0.25, vol: 0.12, delay: 0.06, vib: 30 }); },
    bounce(v = 1) { tone({ type: "sine", f0: 260 + v * 160, f1: 160, dur: 0.06, vol: 0.12 * Math.min(1, v) }); },
    swat() { noise({ dur: 0.05, vol: 0.18, hp: 2500 }); tone({ type: "square", f0: 500, f1: 900, dur: 0.05, vol: 0.12 }); },
    alarm() { for (let i = 0; i < 3; i++) { tone({ type: "square", f0: 1320, dur: 0.08, vol: 0.28, delay: i * 0.24 }); tone({ type: "square", f0: 1760, dur: 0.08, vol: 0.28, delay: i * 0.24 + 0.11 }); } },
    levelup() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ type: "triangle", f0: f, dur: 0.16, vol: 0.3, delay: i * 0.09 })); },
    rumble() { tone({ type: "sawtooth", f0: 70, f1: 45, dur: 0.5, vol: 0.35, vib: 14 }); tone({ type: "sawtooth", f0: 60, f1: 40, dur: 0.45, vol: 0.3, delay: 0.55, vib: 12 }); },
    flip() { noise({ dur: 0.09, vol: 0.12, hp: 1800 }); },
    hiss() { noise({ dur: 0.28, vol: 0.18, hp: 3000 }); },
    dizzy() { [700, 500, 650, 450].forEach((f, i) => tone({ type: "sine", f0: f, f1: f * 0.8, dur: 0.12, vol: 0.25, delay: i * 0.1 })); },
    purr() {
      const a = ctx(); if (!a) return;
      const t = a.currentTime;
      const o = a.createOscillator(); o.type = "sawtooth"; o.frequency.value = 27;
      const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 240;
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.55, t + 0.12);
      g.gain.setValueAtTime(0.55, t + 0.45); g.gain.linearRampToValueAtTime(0.0001, t + 0.62);
      o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.65);
    },
  };
})();

/* =====================================================================
   MOTOR DEL SPRITE (dibujo procedural en píxeles)
   ===================================================================== */
const petCv = $("pet"), pctx = petCv.getContext("2d");
const img = pctx.createImageData(PW, PH);
const owner = new Int8Array(PW * PH);
const edgeMap = new Uint8Array(PW * PH);
let shapesCache = [];
let avatarDirty = true;

const ell = (cx, cy, rx, ry) => (x, y) => {
  const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
  return dx * dx + dy * dy <= 1;
};
function triHit(ax, ay, bx, by, cx, cy) {
  const s = (px, py, x1, y1, x2, y2) => (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
  return (x, y) => {
    const px = x + 0.5, py = y + 0.5;
    const d1 = s(px, py, ax, ay, bx, by), d2 = s(px, py, bx, by, cx, cy), d3 = s(px, py, cx, cy, ax, ay);
    const neg = d1 < 0 || d2 < 0 || d3 < 0, pos = d1 > 0 || d2 > 0 || d3 > 0;
    return !(neg && pos);
  };
}
let target = img;   // ImageData donde se dibuja (el sprite principal o una vista previa)
function put(x, y, c) {
  if (!c || x < 0 || y < 0 || x >= PW || y >= PH) return;
  const i = (y * PW + x) * 4, d = target.data;
  d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
}
const own = (x, y) => (x < 0 || y < 0 || x >= PW || y >= PH ? -1 : owner[y * PW + x]);
const isEdge = (x, y) => edgeMap[y * PW + x] === 1;

function buildShapes(p) {
  const hx = 20 + p.hd, hy = 17 + p.hy;
  const S = [];
  // Cola (curva de Bézier hecha de círculos)
  const sw = p.tail;
  const B = [27, 31.5], M = [34.2 + sw * 1.2, 27.2], T = [32.6 + sw * 3.4, 18.4 - Math.abs(sw) * 0.6];
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, u = 1 - t;
    pts.push([u * u * B[0] + 2 * u * t * M[0] + t * t * T[0], u * u * B[1] + 2 * u * t * M[1] + t * t * T[1], t]);
  }
  const tr = p.puff ? 2.6 : 1.75, tr2 = tr * tr;
  const tailT = (x, y) => {
    let best = 1e9, bt = 0;
    for (const q of pts) { const d = (x + 0.5 - q[0]) ** 2 + (y + 0.5 - q[1]) ** 2; if (d < best) { best = d; bt = q[2]; } }
    return [best, bt];
  };
  S.push({ id: "tail", hit: (x, y) => tailT(x, y)[0] <= tr2, col: (x, y) => {
    const t = tailT(x, y)[1];
    if (t > 0.8) return pal.tip;
    if (pal.stripe && ((t > 0.3 && t < 0.4) || (t > 0.55 && t < 0.65))) return pal.stripe;
    return pal.tailFill || pal.fur;
  } });
  // Cuerpo y patitas (al correr se alternan)
  const fL = p.feet ? p.feet[0] : 0, fR = p.feet ? p.feet[1] : 0;
  S.push({ id: "body", hit: ell(20, 29.6, 8.6, 5.6), col: () => pal.fur });
  S.push({ id: "foot", hit: ell(15.5, 34.2 + fL, 2.7, 1.7), col: () => pal.feet || pal.fur });
  S.push({ id: "foot", hit: ell(24.5, 34.2 + fR, 2.7, 1.7), col: () => pal.feet || pal.fur });
  // Orejas (debajo de la cabeza para que la cabeza las tape)
  const ear = (side, st) => {
    const m = (x) => (side < 0 ? x : 2 * hx - x);
    const tipDx = st > 0 ? -1.6 : 0, tipDy = st > 0 ? 2.4 : st < 0 ? -1 : 0;
    const a = [m(hx - 12), hy - 3.6], b = [m(hx - 9.6 + tipDx), hy - 15.6 + tipDy], c = [m(hx - 3), hy - 8.4];
    const cx = (a[0] + b[0] + c[0]) / 3, cy = (a[1] + b[1] + c[1]) / 3;
    const k = 0.5, inner = triHit(
      cx + (a[0] - cx) * k, cy + (a[1] - cy) * k + 0.6,
      cx + (b[0] - cx) * k, cy + (b[1] - cy) * k + 0.6,
      cx + (c[0] - cx) * k, cy + (c[1] - cy) * k + 0.6);
    const fill = () => (side < 0 ? pal.earFillL : pal.earFillR) || pal.earFill || pal.fur;
    return { id: "ear", hit: triHit(a[0], a[1], b[0], b[1], c[0], c[1]), col: fill, inner };
  };
  S.push(ear(-1, p.earL));
  S.push(ear(1, p.earR));
  // Cabeza
  S.push({ id: "head", hit: ell(hx, hy, 12.5, 9.8), col: () => pal.fur });
  // Chichón tras un golpe
  if (p.bump) S.push({ id: "bump", hit: ell(hx - 2.5, hy - 9.9, 2.4, 2), col: () => pal.blush });
  // Patita levantada (saludar, acicalarse, pensar, frotarse, golpear la pelota)
  if (p.paw) S.push({ id: "paw", hit: ell(hx + p.paw.x, hy + p.paw.y, 2.6, 2.4), col: () => pal.feet || pal.fur });
  return S;
}

function drawEye(ex, ey, kind, right) {
  const E = pal.eye, L = pal.lid, W = pal.white;
  const mx = (dx) => (right ? 2 - dx : dx);
  const rect = (x0, y0, w, h, c) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) put(ex + x0 + x, ey + y0 + y, c); };
  const dots = (list, c, mirror = false) => list.forEach(([dx, dy]) => put(ex + (mirror ? mx(dx) : dx), ey + dy, c));
  switch (kind) {
    case "open":
      rect(0, 0, 3, 4, E);

function drawHat(id, hx, hy, pose, S) {
  const h = HAT_BY[id];
  if (!h || id === "none") return;
  if (h.draw === "cascos") {
    const band = HAT_COL.m, cup = HAT_COL.p;
    for (let i = 0; i <= 40; i++) {            // arco sobre la cabeza
      const a = Math.PI * (1 + i / 40), x = Math.round(hx - 0.5 + Math.cos(a) * 13.3), y = Math.round(hy - 1 + Math.sin(a) * 11.2);
      put(x, y, pal.line); put(x, y + 1, band);
    }
    for (const side of [0, 1]) {               // auriculares
      const x0 = side ? hx + 10 : hx - 14;
      for (let j = -3; j <= 3; j++) for (let i = 0; i < 4; i++) {
        const edge = j === -3 || j === 3 || i === 0 || i === 3;
        put(x0 + i, hy + j, edge ? pal.line : cup);
      }
      put(x0 + (side ? 1 : 2), hy - 1, HAT_COL.k); put(x0 + (side ? 1 : 2), hy, HAT_COL.k);
    }
    return;
  }
  if (h.draw === "bufanda") {
    const red = HAT_COL.r, wh = HAT_COL.w;
    for (let y = 25; y <= 27; y++) for (let x = 9; x <= 30; x++) {
      const o = own(x, y);
      if (o >= 0 && !isEdge(x, y) && (S[o].id === "head" || S[o].id === "body")) put(x, y, ((x >> 1) + (y > 25 ? 1 : 0)) % 2 ? red : wh);
    }
    for (let y = 27; y <= 33; y++) for (let x = 24; x <= 26; x++) {
      const o = own(x, y);
      if (o >= 0 && !isEdge(x, y) && S[o].id === "body") put(x, y, (y >> 1) % 2 ? wh : red);
    }
    return;
  }
  if (h.draw === "aureola") {
    const bob = Math.round(Math.sin((pose.time || 0) * 2.4) * 1);
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      put(Math.round(hx - 0.5 + Math.cos(a) * 6.5), hy - 15 + bob + Math.round(Math.sin(a) * 1.7), HAT_COL.y);
    }
    return;
  }
  h.rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === ".") return;
    const k = h.col && h.col[ch] ? h.col[ch] : ch;
    put(hx + h.ox + i, hy + h.oy + j, ch === "o" && !(h.col && h.col.o) ? pal.line : HAT_COL[k]);
  }));
}

function renderPet(pose, face, out = null) {
  target = out ? out.img : img;
  const S = buildShapes(pose);
  if (!out) shapesCache = S;
  const n = S.length;
  target.data.fill(0);
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {

    owner[y * PW + x] = o;

    const e = own(x - 1, y) < o || own(x + 1, y) < o || own(x, y - 1) < o || own(x, y + 1) < o;
    edgeMap[y * PW + x] = e ? 1 : 0;
    put(x, y, e ? pal.line : S[o].col(x, y));
  }
  const onShape = (x, y, id) => { const o = own(x, y); return o >= 0 && S[o].id === id && !isEdge(x, y); };
  const hx = 20 + pose.hd, hy = 17 + pose.hy;

  // Interior de las orejas, barriga, rayas
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const o = own(x, y); if (o < 0 || isEdge(x, y)) continue;
    const s = S[o];
    if (s.id === "ear" && s.inner(x, y)) put(x, y, pal.ear);
    else if (s.id === "body" && ell(20, 31, 4.6, 3.1)(x, y)) put(x, y, pal.belly);
  }
  // Manchas (calicó, panda, siamés, esmoquin...)
  for (const pt of pal.patches) {

    const cx = onHead ? hx + pt.x : pt.x, cy = onHead ? hy + pt.y : pt.y;
    const hit = ell(cx, cy, pt.rx, pt.ry);
    for (let y = Math.floor(cy - pt.ry); y <= cy + pt.ry; y++) for (let x = Math.floor(cx - pt.rx); x <= cx + pt.rx; x++) {
      if (hit(x, y) && onShape(x, y, pt.on)) put(x, y, pt.rgb);
    }
  }
  if (pal.stripe) {
    const head = [[-3, -8], [-3, -7], [2, -8], [2, -7], [-1, -8], [0, -8], [-1, -7], [0, -7], [-1, -6], [0, -6]];
    if (pal.tiger) head.push([-10, 0], [-9, 0], [-10, 2], [-9, 2], [9, 0], [8, 0], [9, 2], [8, 2], [-6, -8], [5, -8]);
    head.forEach(([dx, dy]) => { if (onShape(hx + dx, hy + dy, "head")) put(hx + dx, hy + dy, pal.stripe); });
    if (pal.tiger) [[14, 28], [14, 29], [13, 31], [13, 32], [25, 28], [25, 29], [26, 31], [26, 32]]
      .forEach(([x, y]) => { if (onShape(x, y, "body")) put(x, y, pal.stripe); });
  }
  // Brillitos que parpadean (galaxia, dorado)
  if (pal.twinkle) {
    const tw = pose.time || 0;
    [[-6, -5, "head"], [5, -6, "head"], [-9, 1, "head"], [8, 2, "head"], [1, -7, "head"], [-3, 6, "head"], [16, 29, "body"], [23, 31, "body"], [19, 33, "body"], [33, 22, "tail"]]
      .forEach(([dx, dy, on], i) => {
        const x = on === "head" ? hx + dx : dx, y = on === "head" ? hy + dy : dy;
        if (Math.sin(tw * 2.6 + i * 1.9) > 0.15 && onShape(x, y, on)) put(x, y, pal.twinkle);
      });
  }
  // Collar y cascabel
  let collarY = -1;
  for (let x = 0; x < PW; x++) for (let y = 1; y < PH; y++) {
    if (onShape(x, y, "body")) {
      const above = own(x, y - 1);
      if (above >= 0 && S[above].id === "head") { put(x, y, pal.collar); if (x === 19) collarY = y; }
      break;
    }
  }
  if (collarY > 0) {
    const bx = 19 + pose.bell;
    put(bx, collarY + 1, pal.bell); put(bx + 1, collarY + 1, pal.bell);
    put(bx, collarY + 2, pal.bellD); put(bx + 1, collarY + 2, pal.bellD);
  }
  // Bigotes
  for (const wy of [hy + 2, hy + 4]) {
    let lx = -1, rx = -1;
    for (let x = 0; x < PW; x++) if (own(x, wy) >= 0 && S[own(x, wy)].id === "head") { if (lx < 0) lx = x; rx = x; }
    for (let k = 1; k <= 3; k++) {
      if (lx - k >= 0 && own(lx - k, wy) < 0) put(lx - k, wy - (wy === hy + 2 && k === 3 ? 1 : 0), pal.whisk);

  const blushPx = [];
  if (face.blush >= 1) blushPx.push([-8, 3], [-7, 3], [6, 3], [7, 3]);
  if (face.blush >= 2) blushPx.push([-9, 3], [8, 3], [-8, 4], [-7, 4], [6, 4], [7, 4]);
  blushPx.forEach(([dx, dy]) => { if (onShape(hx + dx, hy + dy, "head")) put(hx + dx, hy + dy, pal.blush); });
  // Ojos, nariz y boca
  drawEye(hx - 7 + face.lx, hy - 2 + face.ly, face.eyes, false);
  drawEye(hx + 4 + face.lx, hy - 2 + face.ly, face.eyesR || face.eyes, true);
  put(hx - 1, hy + 3, pal.nose); put(hx, hy + 3, pal.nose);
  drawMouth(hx - 3, hy + 4, face.mouth);
  drawHat(pose.hat || "none", hx, hy, pose, S);

  if (out) { out.ctx.putImageData(target, 0, 0); target = img; return; }
  pctx.putImageData(img, 0, 0);
  if (avatarDirty && face.eyes === "open") makeAvatar();
}

function floatUp(kind, px, py, o = {}) {
  const [x, y] = at(px, py);
  spawn(kind, x, y, { vx: o.vx ?? rand(-2, 2), vy: o.vy ?? -9, wob: o.wob ?? 3, life: o.life ?? 1.6 });
}

function drawSprite(ctx, k, x, y, color = null, outline = null) {
  const s = SPR[k]; x = Math.round(x); y = Math.round(y);
  const o = outline || s.o;
  if (o) { ctx.fillStyle = o; for (const [dx, dy] of s.ol) ctx.fillRect(x + dx, y + dy, 1, 1); }
  for (const [dx, dy, c] of s.px) { ctx.fillStyle = c || color || s.c; ctx.fillRect(x + dx, y + dy, 1, 1); }
}
function renderFx(dt, t) {
  fctx.clearRect(0, 0, fxCv.width, fxCv.height);
  drawWorld(dt, t);
  for (let i = FX.length - 1; i >= 0; i--) {
    const p = FX[i];
    p.life -= dt;
    if (p.life <= 0) { FX.splice(i, 1); continue; }
    let x, y;
    if (p.orbit) {
      p.orbit.a += dt * p.orbit.speed;
      const [cx, cy] = at(p.orbit.cx, p.orbit.cy);
      x = cx + Math.cos(p.orbit.a) * p.orbit.rx; y = cy + Math.sin(p.orbit.a) * p.orbit.ry;
    } else {
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      x = p.x + Math.sin(t * 4 + p.ph) * p.wob; y = p.y;
    }
    if (p.life < p.max * 0.25 && Math.floor(p.life * 18) % 2 === 0) continue;
    drawSprite(fctx, p.kind, x, y, p.color);
  }
  // Sombra (se encoge al saltar)
  bctx.clearRect(0, 0, bgCv.width, bgCv.height);
  drawSky();
  const h = clamp(-jump.y / SCALE, 0, 30);
  const rx = 10.5 - h * 0.18, cx = OX + 20 + move.x / SCALE, cy = OY + 35.6;
  bctx.fillStyle = "rgba(59,42,74,0.20)";
  for (let y = -1; y <= 1; y++) {
    const w = Math.round(rx * Math.sqrt(1 - (y / 2) ** 2));
    bctx.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}

   ===================================================================== */
const bubble = $("bubble");
let bubbleTimer = null, typeTimer = null, bubbleKind = null;
function say(text, ms = 2600, { thought = false, sound = true } = {}) {
  clearTimeout(bubbleTimer); clearInterval(typeTimer);
  bubbleKind = thought ? "thought" : "say";
  bubble.classList.toggle("thought", thought);
  bubble.textContent = "";
  bubble.classList.add("show");
  if (thought) {
    const d = document.createElement("span"); d.className = "dots";
    bubble.append(text || "", d);
  } else {
    let i = 0;
    const chars = [...text];
    typeTimer = setInterval(() => {
      i++;
      bubble.textContent = chars.slice(0, i).join("");
      if (sound && i % 2 === 0) Sfx.type();
      if (i >= chars.length) clearInterval(typeTimer);
    }, 26);
  }
  if (ms > 0) bubbleTimer = setTimeout(hideBubble, ms + text.length * 26);
}
function hideBubble() {
  clearTimeout(bubbleTimer); clearInterval(typeTimer);
  bubble.classList.remove("show"); bubbleKind = null;
}

  wave: { start: 0, until: 0 },
  puffUntil: 0, tailBoostUntil: 0,
  dizzyUntil: 0, wiggleUntil: 0, spin: null,
  pet: { until: 0, lastX: null, lastDir: 0, changes: [], lastFx: 0, lastPurr: 0, spoke: 0 },
  clicks: [],
  talkLevel: 0, mouthFrame: "w", mouthT: 0, lastBlip: 0,
  nextIdle: now() + 6000, nextZ: 0, nextSweat: 0,

};
const move = { x: 0, tw: null };   // desplazamiento horizontal (px) para saltar hacia algo
const springs = { sx: { v: 1, vel: 0, t: 1 }, sy: { v: 1, vel: 0, t: 1 }, rot: { v: 0, vel: 0, t: 0 } };
const jump = { y: 0, vy: 0, active: false };
let drag = null;

function stepSpring(s, dt, k = 320, d = 15) { const a = -k * (s.v - s.t) - d * s.vel; s.vel += a * dt; s.v += s.vel * dt; }
function squash(sx, sy) { springs.sx.v = sx; springs.sy.v = sy; springs.sx.vel = springs.sy.vel = 0; }
function doJump(power = 170) {
  if (jump.active) return;
  jump.active = true; jump.vy = -power;
  squash(0.88, 1.14); Sfx.boing();
}
function express(e, ms) { P.expr = e; P.exprUntil = now() + ms; }
function eyeSeq(frames) { P.eyeSeq = { frames, start: now() }; }
function earsFor(L, R, ms) { P.ears = { L, R, until: now() + ms }; }
function lookFor(x, y, ms) { P.lookOv = { x, y }; P.lookOvUntil = now() + ms; }
function tiltFor(v, ms) { P.tilt = { v, until: now() + ms }; }
function waveFor(ms) { P.wave = { start: now(), until: now() + ms }; }

function touch() { P.lastInteract = now(); }
function wakeUp(silent = false) {
  if (!P.sleeping) return;
  P.sleeping = false; touch();
  express({ eyes: "wide", mouth: "o" }, 700);
  floatUp("excl", 27, 0, { vy: -14, wob: 0, life: 0.9 });
  doJump(150);
  if (!silent) say(pick(["¡¿Eh?! ¡Estoy despierta!", "Mmm... ¿qué pasa?", "¡No estaba dormida!"]));
}
function goSleep() {
  if (P.sleeping || P.dozing) return;
  P.dozing = true;
  express({ eyes: "closed", mouth: "yawn" }, 1300);
  setTimeout(() => {
    P.dozing = false;
    if (now() - P.lastInteract < sleepAfter() || P.mode !== "idle") return;
    P.sleeping = true; P.nextZ = 0;
    say("Zzz...", 1800, { sound: false });
  }, 1300);
}

function onPetClick(zone) {
  touch(); cancelActs();
  if (P.sleeping) return wakeUp();
  Sfx.pop();
  squash(1.15, 0.86);
  const t = now();
  P.clicks = P.clicks.filter((c) => t - c < 2200);
  P.clicks.push(t);
  Life.clicked();
  if (P.clicks.length >= 5) { P.clicks = []; return dizzy(); }
  if (t < P.dizzyUntil) return;
  if (zone === "top") return bonk();
  if (zone === "tail") return reactTail();
  if (zone === "belly") return reactBelly();
  reactHead();
}

function startPetting(dir) {
  const t = now();
  const first = t > P.pet.until + 600;
  P.pet.until = t + 900;
  if (first) Life.petted(); else Life.bump("love", 0.12);
  tiltFor(dir > 0 ? 1 : -1, 900);
  if (first && t - P.pet.spoke > 6000) { P.pet.spoke = t; say(pick(["Prrrrr ♥", "Mmmm, qué gustito...", "Más, más ♥", "¡Me encantan las caricias!"])); }
  if (t - P.pet.lastFx > 380) { P.pet.lastFx = t; floatUp(Math.random() < 0.6 ? "heartS" : "note", rand(8, 32), 2, { vy: -10 }); }
  if (t - P.pet.lastPurr > 560) { P.pet.lastPurr = t; Sfx.purr(); }
}

const catCX = () => OX + 20 + move.x / SCALE;
const easeOut = (x) => 1 - (1 - x) * (1 - x);
function moveTo(px, ms) { move.tw = { from: move.x, to: px, start: now(), dur: ms }; }
function reachX(lx) {   // px de desplazamiento para acercarse a la x lógica lx sin salirse del escenario
  return clamp((lx - (OX + 20)) * SCALE, -OX * SCALE, (SW - OX - PW) * SCALE);
}
function goHome(delay = 0) {
  setTimeout(() => { moveTo(0, 900); doJump(60); setTimeout(() => doJump(60), 450); }, delay);
}

/* ---- Teclado: aparece cuando tú escribes y cuando Mochi te responde ---- */
const KB = { vis: 0, ai: false, userUntil: 0, nextAi: 0, bobUntil: 0, side: 0, lit: [], shown: false,
  paws: [{ c: 1, row: 0, down: 0 }, { c: 6, row: 0, down: 0 }] };
const KBX = 6, KBY = 27, KBW = 28, KBH = 9;
const kbOn = (t) => KB.ai || t < KB.userUntil;
function kbTap(t, ai) {
  const side = (KB.side = 1 - KB.side);
  const paw = KB.paws[side];
  const r = Math.random();
  paw.row = r < 0.14 ? 2 : r < 0.6 ? 0 : 1;
  paw.c = paw.row === 2 ? 0 : side ? 4 + Math.floor(Math.random() * 4) : Math.floor(Math.random() * 4);
  paw.down = t + (ai ? 60 : 90);
  KB.lit.push({ row: paw.row, c: paw.c, until: t + 120 });
  KB.bobUntil = t + 70;
  if (ai && KB.vis > 0.9 && Math.random() < 0.3) {
    const [x, y] = [OX + move.x / SCALE + KBX + 2 + paw.c * 3, OY + KBY - 4];
    spawn(pick(GLYPH_KEYS), x, y, { vx: rand(-8, 8), vy: -rand(12, 20), g: 14, life: 1, color: pick(["#3b2a4a", "#e0577f", "#5aa9e6", "#8a6fd1"]) });
  }
}
function drawKeyboard(dt, t) {
  const target = kbOn(t) ? 1 : 0;
  KB.vis = clamp(KB.vis + (target ? 1 : -1) * dt * 5, 0, 1);
  if (KB.vis >= 1 && !KB.shown) {
    KB.shown = true;
    for (let i = 0; i < 6; i++) spawn("dust", OX + KBX + rand(0, KBW), OY + KBY + 7, { vx: rand(-14, 14), vy: -rand(3, 9), g: 25, life: 0.5 });
  }
  if (KB.vis <= 0) { KB.shown = false; return; }
  if (KB.ai && t > KB.nextAi && KB.vis > 0.6) {
    kbTap(t, true);
    KB.nextAi = t + rand(55, 140);
    if (Math.random() < 0.6) Sfx.key();
  }
  KB.lit = KB.lit.filter((l) => l.until > t);
  const ox = Math.round(OX + move.x / SCALE + KBX), oy = Math.round(OY + KBY + (1 - easeOut(KB.vis)) * 13);
  const g = fctx;
  g.fillStyle = "#3b2a4a"; g.fillRect(ox + 1, oy, KBW - 2, KBH); g.fillRect(ox, oy + 1, KBW, KBH - 2);
  g.fillStyle = "#cdbdf0"; g.fillRect(ox + 1, oy + 1, KBW - 2, KBH - 3);
  g.fillStyle = "#a996d8"; g.fillRect(ox + 1, oy + KBH - 2, KBW - 2, 1);
  const isLit = (row, c) => KB.lit.some((l) => l.row === row && (row === 2 || l.c === c));
  for (let row = 0; row < 2; row++) for (let c = 0; c < 8; c++) {
    g.fillStyle = isLit(row, c) ? "#ff8fab" : "#ffffff";
    g.fillRect(ox + 2 + c * 3, oy + 2 + row * 2, 2, 1);
  }
  g.fillStyle = isLit(2, 0) ? "#ff8fab" : "#ffffff"; g.fillRect(ox + 8, oy + 6, 12, 1);
  g.fillStyle = KB.ai && Math.floor(t / 180) % 2 ? "#5fd38d" : "#7d6aa8"; g.fillRect(ox + 25, oy + 2, 1, 1);
  // Patitas encima de las teclas
  const sk = SKINS[skinId];
  KB.paws.forEach((p, i) => {
    const down = t < p.down;
    const cx = p.row === 2 ? ox + (i ? 16 : 11) : ox + 2 + p.c * 3 + 1;
    const ry = p.row === 2 ? oy + 6 : oy + 2 + p.row * 2;
    drawSprite(g, "paw", cx - 2, ry - (down ? 2 : 4), sk.fur, sk.line);
  });
}

/* ---- Pescadito: haz clic en el escenario para darle de comer ---- */
const FISH = [];
function dropFish(x, y) {
  const floor = OY + 32;
  FISH.push({ x: clamp(x, 2, SW - 9), y: Math.min(y, floor), vy: 0, state: "fall", life: 7, floor });
  Sfx.drop();
  touch();
  if (P.sleeping) wakeUp();
}
function updateFish(dt) {
  for (let i = FISH.length - 1; i >= 0; i--) {
    const f = FISH[i];
    if (f.state === "fall") {
      f.vy += 90 * dt; f.y += f.vy * dt;
      if (f.y >= f.floor) {
        f.y = f.floor; f.state = "floor";
        for (let k = 0; k < 3; k++) spawn("dust", f.x + 3, f.y + 3, { vx: rand(-10, 10), vy: -rand(2, 6), g: 25, life: 0.4 });
      }
    } else if (!f.claimed) {
      f.life -= dt;
      if (f.life <= 0) { FISH.splice(i, 1); continue; }
    }
    if (f.life < 1.5 && Math.floor(f.life * 10) % 2 === 0) continue;
    drawSprite(fctx, "fish", f.x, f.y);
  }
}
function munch() {
  Life.fed();
  P.munchUntil = now() + 1100;
  express({ eyes: "happy", blush: 2 }, 1100);
  Sfx.crunch();
  for (let i = 0; i < 5; i++) { const [x, y] = at(20, 23); spawn("crumb", x, y, { vx: rand(-12, 12), vy: -rand(4, 12), g: 40, life: 0.7 }); }
  setTimeout(() => floatUp("heartS", 20, 2, { vy: -10 }), 500);
  say(pick(["¡Ñam!", "¡Qué rico! ♥", "¡Pescadito!", "¡Ñam, ñam!"]), 1300);
}
function tryEat(t) {
  if (P.eating || P.mode !== "idle" || P.sleeping || drag || kbOn(t) || P.hunt || jump.active) return;
  const f = FISH.find((x) => x.state === "floor" && !x.claimed);
  if (!f) return;
  P.fed = P.fed.filter((x) => t - x < 25000);
  if (P.fed.length >= 4) {
    if (t > P.fullCool) { P.fullCool = t + 9000; express({ eyes: "happy", mouth: "w", blush: 2 }, 1500); say("¡Estoy llenísima! Gracias ♥", 1800); P.wiggleUntil = t + 500; }
    return;
  }
  P.eating = f; f.claimed = true;
  lookFor(Math.sign(f.x + 3 - catCX()), 1, 400);
  express({ eyes: "wide", mouth: "o" }, 450);
  setTimeout(() => {
    const dx = reachX(f.x + 3);
    if (Math.abs(dx - move.x) > 6) { moveTo(dx, 380); doJump(150); }
    setTimeout(() => {
      const i = FISH.indexOf(f);
      if (Math.abs(f.x + 3 - catCX()) < 16) {
        if (i >= 0) FISH.splice(i, 1);
        P.fed.push(now()); munch();
      } else {
        f.claimed = false; f.life = 3;
        express({ eyes: "sad", mouth: "flat" }, 900); say("¡No llego!", 1200);
      }
      setTimeout(() => { P.eating = null; if (move.x) goHome(); }, 1200);
    }, 450);
  }, 350);
}

/* ---- Mariposa que pasa volando (y Mochi intenta cazarla) ---- */
let BF = null;
function spawnButterfly() {
  if (BF) return;
  const dir = Math.random() < 0.5 ? 1 : -1;
  BF = { x: dir > 0 ? -6 : SW + 2, y: 6, base: rand(2, 9), dir, t0: clock, tried: false, color: pick(["#ffd166", "#c3a6ff", "#7ec8ff", "#ffb3c6"]) };
}
function updateButterfly(dt) {
  if (!BF) return;
  BF.x += BF.dir * 12 * dt;
  BF.y = BF.base + Math.sin((clock - BF.t0) * 3.2) * 3;
  if (BF.x < -10 || BF.x > SW + 8) { BF = null; return; }
  drawSprite(fctx, Math.floor(clock * 9) % 2 ? "bfA" : "bfB", BF.x - 2, BF.y - 2, BF.color);
}
function chaseButterfly(t) {
  if (!BF || BF.tried || P.mode !== "idle" || P.sleeping || drag || jump.active || P.eating || kbOn(t)) return;
  if (Math.abs(BF.x - catCX()) > 4) return;
  BF.tried = true;
  express({ eyes: "wide", mouth: "o" }, 700);
  doJump(250);
  setTimeout(() => {
    if (BF && Math.random() < 0.45) {
      for (let i = 0; i < 6; i++) spawn("spark", BF.x - 2, BF.y - 2, { vx: rand(-20, 20), vy: rand(-20, 5), g: 20, life: 0.8 });
      BF = null;
      express({ eyes: "happy", mouth: "smile", blush: 2 }, 1200);
      Sfx.sparkle();
      say(pick(["¡Te pillé! ...y te suelto ♥", "¡La cacé!", "¡Mía! Bueno, vuela libre"]), 1800);
    } else {
      express({ eyes: "angry", mouth: "wavy" }, 900);
      say(pick(["¡Casi!", "¡Jo, se escapó!", "¡La próxima es mía!"]), 1300);
    }
  }, 280);
}

/* ---- Cazar el cursor: si mueves mucho el ratón por su zona, se agazapa y salta ---- */
function huntCheck(t) {
  if (P.hunt || t < P.huntCool || P.mode !== "idle" || P.sleeping || drag || P.eating || BF || kbOn(t) || jump.active) return;
  P.stageMoves = P.stageMoves.filter((m) => t - m.t < 1600);
  const n = P.stageMoves.length;
  if (n < 28) return;
  const last = P.stageMoves[n - 1];
  if (t - last.t > 150 || Math.abs(last.x - catCX()) < 14) return;
  P.hunt = { phase: "crouch" };
  springs.sx.t = 1.1; springs.sy.t = 0.86;
  earsFor(1, 1, 1000);
  express({ eyes: "wide", mouth: "w" }, 1500);
  setTimeout(() => {
    springs.sx.t = 1; springs.sy.t = 1;
    const tgt = P.stageMoves.length ? P.stageMoves[P.stageMoves.length - 1].x : last.x;
    P.hunt.phase = "pounce";
    moveTo(reachX(tgt), 380); doJump(180);
    setTimeout(() => {
      const recent = P.stageMoves.filter((m) => now() - m.t < 400);
      const hit = recent.some((m) => Math.abs(m.x - catCX()) < 12);
      if (hit) { express({ eyes: "happy", mouth: "smile", blush: 2 }, 1000); burst("star", 20, 6, 3, 14, 14); say(pick(["¡Te cacé!", "¡Atrapado!", "¡Ja! ¡Mío!"]), 1300); }
      else { express({ eyes: "angry", mouth: "flat" }, 900); say(pick(["¡Se me escapó!", "¡Ratón escurridizo!"]), 1300); }
      P.hunt = null; P.huntCool = now() + 12000;
      goHome(900);
    }, 480);
  }, 950);
}

const BALL = { active: false, x: 0, y: 0, vx: 0, vy: 0, held: false, trail: [], roll: 0, lastTouch: 0 };
const BALL_R = 2.5;
const ballFloor = () => OY + 35 - BALL_R;
function toggleBall() {
  if (BALL.active) {
    for (let i = 0; i < 6; i++) spawn("spark", BALL.x - 2, BALL.y - 2, { vx: rand(-20, 20), vy: rand(-20, 5), g: 20, life: 0.6 });

  }

  P.play = { next: now() + 500, retarget: 0, start: now(), tiredUntil: 0, lastSeen: now(), spoke: 0 };
  touch(); if (P.sleeping) wakeUp(true);
  Sfx.drop();
  express({ eyes: "wide", mouth: "o", blush: 2 }, 900);
  earsFor(-1, -1, 900);

function updateBall(dt) {
  if (!BALL.active) return;
  if (!BALL.held) {
    BALL.vy += 150 * dt;
    BALL.x += BALL.vx * dt; BALL.y += BALL.vy * dt;
    const fl = ballFloor();
    if (BALL.y > fl) {
      BALL.y = fl;
      if (BALL.vy > 18) { Sfx.bounce(BALL.vy / 90); BALL.vy = -BALL.vy * 0.55; }
      else BALL.vy = 0;
    }
    if (BALL.y >= fl - 0.5) BALL.vx *= Math.max(0, 1 - 1.8 * dt);
    if (BALL.x < BALL_R) { BALL.x = BALL_R; BALL.vx = Math.abs(BALL.vx) * 0.7; Sfx.bounce(0.4); }
    if (BALL.x > SW - BALL_R) { BALL.x = SW - BALL_R; BALL.vx = -Math.abs(BALL.vx) * 0.7; Sfx.bounce(0.4); }
    if (BALL.y < BALL_R) { BALL.y = BALL_R; BALL.vy = Math.abs(BALL.vy) * 0.5; }
    if (Math.abs(BALL.vx) < 0.5) BALL.vx = 0;
    BALL.roll += BALL.vx * dt;
  }
  drawSprite(fctx, Math.floor(Math.abs(BALL.roll) / 1.6) % 2 ? "ballA" : "ballB", BALL.x - BALL_R, BALL.y - BALL_R);
}
const ballMoving = () => BALL.active && (Math.abs(BALL.vx) > 3 || Math.abs(BALL.vy) > 3);
function playBall(t) {
  if (!BALL.active || BALL.held || P.mode !== "idle" || P.sleeping || drag || P.eating || P.hunt || kbOn(t) || t < P.bonkUntil) return;
  const pl = P.play;
  if (t < pl.tiredUntil) return;
  if (t - pl.start > 32000) {
    pl.tiredUntil = t + 20000; pl.start = t + 20000;
    express({ eyes: "happy", mouth: "yawn", blush: 2 }, 1400);
    say("¡Uf! Me he cansado... luego seguimos", 2000);
    goHome(1200);
    return;
  }
  const cx = catCX();
  const dx = BALL.x - cx;
  const low = BALL.y > OY + 20;
  // Correr hacia la pelota
  if (Math.abs(dx) > 7 && t > pl.retarget && !jump.active) {
    pl.retarget = t + 260;
    const to = reachX(BALL.x);
    if (Math.abs(to - move.x) > 4) moveTo(to, clamp(Math.abs(to - move.x) * 4.5, 250, 1100));
    else if (t > pl.spoke && (BALL.x < 12 || BALL.x > SW - 12)) { pl.spoke = t + 6000; say(pick(["¡No llego!", "¡Tráemela!"]), 1300); }
  }
  // Si está en una esquina a la que no llega andando, estira la pata
  const atLimit = Math.abs(reachX(BALL.x) - move.x) < 3 && !move.tw;
  const reach = atLimit ? 18 : 7;
  // Darle un zarpazo, saltar encima o empujarla con la cabeza
  if (Math.abs(dx) <= reach && low && t > pl.next && !jump.active) {
    pl.next = t + rand(650, 1100);
    BALL.lastTouch = t;
    const away = BALL.x < SW / 2 ? 1 : -1;
    const dir = Math.random() < 0.75 ? away : -away;
    const r = Math.abs(dx) > 7 ? 0 : Math.random();   // desde lejos solo puede dar zarpazos
    if (r < 0.62) {
      P.batUntil = t + 220; P.batDir = Math.sign(dx) || dir;
      BALL.vx = dir * rand(45, 85); BALL.vy = -rand(35, 75);
      Sfx.swat(); Life.played(); express({ eyes: "happy", mouth: "smile" }, 500);
      if (Math.random() < 0.3) say(pick(["¡Toma!", "¡Zas!", "¡Ahí va!", "¡Mía!"]), 900);
    } else if (r < 0.88) {
      doJump(170);
      setTimeout(() => { if (BALL.active && !BALL.held) { BALL.vx = rand(-60, 60); BALL.vy = -rand(40, 70); Sfx.swat(); } }, 420);
      express({ eyes: "wide", mouth: "o" }, 500);
      if (Math.random() < 0.4) say(pick(["¡Al ataque!", "¡Te tengo!"]), 900);
    } else {
      tiltFor(dir, 400); BALL.vx = dir * rand(25, 40); BALL.vy = -10;
      express({ eyes: "happy", mouth: "w", blush: 2 }, 600);
    }
  }
}

/* =====================================================================
   MEMORIA A LARGO PLAZO
   Tras cada respuesta, un segundo paso con la misma IA decide si el
   mensaje del usuario contiene algo que merezca recordarse. El código
   además filtra secretos y datos que el modelo se invente.
   ===================================================================== */
const MEMORY_MAX = 60;
let memory = [];
try { const m = JSON.parse(load("mochi.memory", "[]")); if (Array.isArray(m)) memory = m.filter((x) => x && typeof x.text === "string" && typeof x.id === "string"); } catch {}
let memOn = load("mochi.memOn") !== "0";
let memQueue = Promise.resolve();
let memBusy = false;
function saveMemory() { save("mochi.memory", JSON.stringify(memory)); }

const MEM_SYSTEM = `Eres el módulo de memoria de Mochi, una asistente virtual. Decides qué merece la pena recordar A LARGO PLAZO sobre el usuario a partir de su último mensaje.

GUARDA solo datos duraderos y útiles para futuras conversaciones que el usuario haya dicho sobre sí mismo:
- su nombre o cómo quiere que le llamen, su edad o cumpleaños
- dónde vive, estudia o trabaja, a qué se dedica
- gustos, aficiones, preferencias, dieta o alergias
- mascotas, familia y personas importantes (con su relación)
- proyectos u objetivos que van a durar
- cómo prefiere que le respondas (tono, longitud, idioma)
- cualquier cosa que pida explícitamente que recuerdes

NO GUARDES:
- preguntas o peticiones puntuales ("explícame X", "cuéntame un chiste", "¿qué hora es?")
- estados pasajeros ("hoy estoy cansado", "tengo hambre", "estoy aburrido")
- datos que ya estén en los recuerdos actuales (aunque estén escritos de otra forma)
- cosas que dijo Mochi, suposiciones o deducciones tuyas
- secretos: contraseñas, PIN, números de tarjeta o de cuenta, documentos de identidad. NUNCA, aunque lo pida.

Si el usuario corrige o cambia un dato ya guardado, usa "update" con su id.
Si pide que olvides algo, usa "remove" con su id.
Escribe cada recuerdo como una frase corta en tercera persona y en español, por ejemplo "Se llama Iker." o "Le encanta el café solo.".
La mayoría de los mensajes NO contienen nada que guardar: entonces devuelve las tres listas vacías.

Ejemplos:
Mensaje: "¿Cuál es la capital de Francia?" -> {"add":[],"update":[],"remove":[]}
Mensaje: "Me llamo Ana y tengo un perro que se llama Toby" -> {"add":["Se llama Ana.","Tiene un perro llamado Toby."],"update":[],"remove":[]}
Mensaje: "Hoy estoy un poco triste" -> {"add":[],"update":[],"remove":[]}

Responde SOLO con JSON: {"add": ["..."], "update": [{"id": "...", "text": "..."}], "remove": ["..."]}`;

const MEM_SCHEMA = {
  type: "object",
  properties: {
    add: { type: "array", items: { type: "string" } },
    update: { type: "array", items: { type: "object", properties: { id: { type: "string" }, text: { type: "string" } }, required: ["id", "text"] } },
    remove: { type: "array", items: { type: "string" } },
  },
  required: ["add", "update", "remove"],
};

// Datos que jamás se guardan, diga lo que diga el modelo
const SECRET_RE = /(contrase|password|passwd|\bpin\b|\bclave\b|cvv|\biban\b|n[uú]mero de (la )?(tarjeta|cuenta)|\b(?:\d[ -]?){12,19}\b|\b\d{8}[ -]?[a-z]\b|\bdni\b|\bnie\b|pasaporte|seguridad social)/i;
const FORGET_RE = /(olvid|borra|elimin|quita|ya no|no recuerdes|deja de recordar|eso no es|no es verdad|me equivoqu|correg|cambi)/i;
const STOP = new Set(["tiene", "llama", "llamo", "llamado", "llamada", "gusta", "gustan", "encanta", "encantan", "prefiere", "quiere", "usuario", "usuaria", "esta", "estan", "como", "para", "pero", "tambien", "muy", "sobre", "cuando", "nombre", "años", "anos", "suele", "siempre", "mucho", "mucha", "algo", "este", "esta", "eres", "mochi"]);
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const tokens = (s) => norm(s).match(/[a-zñ0-9]+/g) || [];
// ¿El recuerdo sale de verdad de lo que dijo el usuario? (evita que el modelo se invente cosas)
function grounded(text, userText) {
  const user = tokens(userText);
  const pref = new Set(user.filter((w) => w.length >= 4).map((w) => w.slice(0, 4)));
  const nums = new Set(user.filter((w) => /\d/.test(w)));
  const key = tokens(text).filter((w) => (/\d/.test(w) || (w.length >= 4 && !STOP.has(w))));
  if (!key.length) return false;
  return key.some((w) => (/\d/.test(w) ? nums.has(w) : pref.has(w.slice(0, 4))));
}
function cleanMem(t) {
  if (typeof t !== "string") return null;
  t = t.replace(/\s+/g, " ").trim().replace(/^[-•*]\s*/, "");
  if (t.length < 4 || t.length > 160) return null;
  if (SECRET_RE.test(t)) return null;
  if (!/[.!?]$/.test(t)) t += ".";
  return t[0].toUpperCase() + t.slice(1);
}
function isDuplicate(t, exceptId = null) {
  const n = norm(t).replace(/[^a-zñ0-9 ]/g, "").trim();
  return memory.some((m) => {
    if (m.id === exceptId) return false;
    const o = norm(m.text).replace(/[^a-zñ0-9 ]/g, "").trim();
    return o === n || o.includes(n) || n.includes(o);
  });
}
const newId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function applyMemoryOps(out, userText) {
  const changes = [];
  if (!out || typeof out !== "object") return changes;
  const adds = Array.isArray(out.add) ? out.add.slice(0, 3) : [];
  const ups = Array.isArray(out.update) ? out.update.slice(0, 3) : [];
  const rems = Array.isArray(out.remove) ? out.remove : [];
  if (FORGET_RE.test(userText)) {
    for (const id of rems) {
      const i = memory.findIndex((m) => m.id === id);
      if (i >= 0) { changes.push({ type: "forget", text: memory[i].text }); memory.splice(i, 1); }
    }
  }
  for (const u of ups) {
    if (!u || typeof u.id !== "string") continue;
    const m = memory.find((x) => x.id === u.id);
    const t = cleanMem(u.text);
    if (!m || !t || norm(t) === norm(m.text) || !grounded(t, userText) || isDuplicate(t, m.id)) continue;
    m.text = t; m.updated = Date.now();
    changes.push({ type: "update", text: t });
  }
  for (const a of adds) {
    const t = cleanMem(a);
    if (!t || !grounded(t, userText) || isDuplicate(t)) continue;
    memory.push({ id: newId(), text: t, created: Date.now() });
    changes.push({ type: "add", text: t });
    Life.mem();
  }
  while (memory.length > MEMORY_MAX) memory.shift();
  if (changes.length) saveMemory();
  return changes;
}

async function askMemoryModel(model, payload, format) {
  const res = await fetch(OLLAMA + "/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model, stream: false, format, options: { temperature: 0 },
      messages: [{ role: "system", content: MEM_SYSTEM }, { role: "user", content: payload }],
    }),
  });
  if (!res.ok) throw Object.assign(new Error("HTTP " + res.status), { status: res.status });
  const data = await res.json();
  const txt = (data && data.message && data.message.content) || "";
  const m = txt.match(/\{[\s\S]*\}/);
  return m ? JSON.parse(m[0]) : null;
}

async function evaluateMemory(userText, replyText) {
  if (!memOn || statusEl.className !== "on") return;
  if (tokens(userText).length < 2) return;
  const model = modelSel.value;
  const payload = JSON.stringify({
    recuerdos_actuales: memory.map((m) => ({ id: m.id, text: m.text })),
    mensaje_usuario: userText.slice(0, 1500),
    respuesta_de_mochi: replyText.slice(0, 500),
  });
  memBusy = true;
  let out = null;
  try {
    try { out = await askMemoryModel(model, payload, MEM_SCHEMA); }
    catch (e) { if (e.status === 400 || e.status === 500) out = await askMemoryModel(model, payload, "json"); else throw e; }
  } catch { out = null; }
  finally { memBusy = false; }
  const changes = applyMemoryOps(out, userText);
  if (!changes.length) return;
  for (const c of changes) {
    const verb = c.type === "add" ? "Recordado" : c.type === "update" ? "Actualizado" : "Olvidado";
    addMemLine(`✎ ${verb}: ${c.text}`);
  }
  renderMemory();
  if (P.mode === "idle" && !P.sleeping) {
    const forgot = changes.every((c) => c.type === "forget");
    express({ eyes: "happy", mouth: "smile", blush: 2 }, 900);
    burst("spark", 20, 4, 3, 14, 14);
    Sfx.chime();
    say(forgot ? "Vale, ya lo he olvidado" : pick(["¡Apuntado! Me acordaré ♥", "¡Lo guardo en mi memoria!", "¡Eso no se me olvida!"]), 1800);
  }
}
function queueMemory(userText, replyText) {
  memQueue = memQueue.then(() => evaluateMemory(userText, replyText)).catch(() => {});
}

function memorySection() {
  if (!memOn) return "";
  let s = "\n\nTienes memoria a largo plazo: lo importante que el usuario te cuenta sobre sí mismo se guarda solo. " +
    "Si te pide guardar una contraseña, un PIN o datos bancarios, dile con cariño que por seguridad eso no lo guardas.";
  if (memory.length) {
    s += "\n\nDATOS DE LA PERSONA CON LA QUE HABLAS (cada frase habla de ella, no de ti):\n" + memory.map((m) => "- " + m.text).join("\n") +
      "\nUsa estos datos con naturalidad: llámale por su nombre y, si te pregunta algo de esta lista (por ejemplo «¿cómo me llamo?»), respóndele con estos datos. Nunca digas que no lo sabes si está aquí.";
  }
  return s;
}
function buildSystemPrompt() {
  let when = "";
  try { when = new Date().toLocaleString("es-ES", { dateStyle: "full", timeStyle: "short" }); } catch { when = new Date().toString(); }
  return SYSTEM_PROMPT + personaPrompt() + `\nFecha y hora actuales: ${when}.` + memorySection();
}
// Los modelos pequeños se fijan sobre todo en el último mensaje: les recordamos los datos justo ahí.
// La nota solo va en la petición; el historial guardado no se toca.
function buildChatMessages() {
  const msgs = history.slice(-MAX_HISTORY).map((m) => ({ role: m.role, content: m.content }));
  const last = msgs[msgs.length - 1];
  if (memOn && memory.length && last && last.role === "user") {
    last.content += "\n\n[Nota privada para Mochi, no la menciones ni la cites: sobre la persona que te escribe sabes que → " +
      memory.map((m) => m.text).join(" ") + " Úsalo si viene a cuento.]";
  }
  return [{ role: "system", content: buildSystemPrompt() }, ...msgs];
}

// Captura instantánea del nombre ("me llamo X", "mi nombre es X", "llámame X")
const NAME_RE = /\b(?:me llamo|mi nombre es|ll[aá]mame|puedes llamarme|me puedes llamar)\s+([a-záéíóúñü]+)(?:\s+([a-záéíóúñü]+))?/i;
const NOT_NAME = new Set(["la", "el", "los", "las", "un", "una", "a", "de", "que", "mucho", "muy", "asi", "así", "como", "cómo", "bien", "mal", "yo", "tu", "tú", "hoy", "ahora", "y", "pero", "con", "por", "para"]);
function quickName(text) {
  const m = text.match(NAME_RE);
  if (!m || NOT_NAME.has(m[1].toLowerCase()) || m[1].length < 2) return null;
  const cap = (w) => w[0].toUpperCase() + w.slice(1).toLowerCase();
  let name = cap(m[1]);
  if (m[2] && /^[A-ZÁÉÍÓÚÑ]/.test(m[2]) && !NOT_NAME.has(m[2].toLowerCase())) name += " " + cap(m[2]);
  return name;
}
function rememberName(name) {
  const t = `Se llama ${name}.`;
  const old = memory.find((m) => /^se llama /i.test(m.text));
  if (old && norm(old.text) === norm(t)) return;
  if (old) { old.text = t; old.updated = Date.now(); addMemLine("✎ Actualizado: " + t); }
  else { memory.push({ id: newId(), text: t, created: Date.now() }); addMemLine("✎ Recordado: " + t); }
  while (memory.length > MEMORY_MAX) memory.shift();
  saveMemory(); renderMemory();
  Sfx.chime();
  burst("heartS", 20, 4, 2, 12, 14);
}

// Aviso si el modelo elegido no es bueno conversando
const hinted = new Set();
function checkModelHint() {
  const name = modelSel.value || "";
  if (!name || hinted.has(name) || statusEl.className !== "on") return;
  let why = null;
  if (/coder/i.test(name)) why = `«${name}» es un modelo hecho para programar: para charlar y recordar cosas de ti funciona bastante peor.`;
  else if (/[:-](0\.5b|1b|1\.5b)\b/i.test(name)) why = `«${name}» es un modelo muy pequeño: es rápido, pero se le olvidan cosas y a veces no sigue las instrucciones.`;
  if (!why) return;
  hinted.add(name);
  const m = sysMsg(why + " Te recomiendo qwen2.5:3b (unos 2 GB, muy bueno en español).");
  const options = [...modelSel.options].map((o) => o.value);
  const good = options.find((o) => /^(qwen2\.5:(3b|7b)|llama3\.[12](:latest|:3b|:8b)?|gemma2?:)/i.test(o) && !/coder/i.test(o));
  const b = document.createElement("button");
  b.className = "px-btn"; b.style.marginTop = "6px"; b.style.display = "block"; b.style.marginInline = "auto";
  if (good) { b.textContent = "USAR " + good.toUpperCase(); b.onclick = () => { modelSel.value = good; save("mochi.model", good); b.remove(); say(`¡Ahora uso ${good}!`, 1500); }; }
  else { b.textContent = "DESCARGAR QWEN2.5:3B"; b.onclick = () => pullModel("qwen2.5:3b"); }
  m.append(b);
}

function addMemLine(text) {
  const line = document.createElement("div");
  line.className = "line mem";
  const m = document.createElement("div");
  m.className = "msg pixbox"; m.textContent = text; m.title = "Ver todo lo que recuerdo";

}

// ---- Panel de recuerdos ----
const memList = $("memlist"), memNew = $("mem-new"), memTog = $("mem-on"), memClear = $("mem-clear");
function renderMemory() {
  memTog.textContent = memOn ? "ACTIVA" : "APAGADA";
  memTog.classList.toggle("on", memOn);
  memList.textContent = "";
  if (!memory.length) {
    const e = document.createElement("div"); e.className = "memempty";
    e.textContent = memOn
      ? "Todavía no sé nada de ti. ¡Cuéntame cosas! Por ejemplo: «Me llamo…», «Me encanta…», «Trabajo de…»"
      : "La memoria está apagada: no guardaré nada de lo que me cuentes.";
    memList.append(e);
    return;
  }
  for (const m of [...memory].reverse()) {
    const it = document.createElement("div"); it.className = "memitem pixbox";
    const tx = document.createElement("span"); tx.className = "txt"; tx.textContent = m.text;
    const del = document.createElement("button"); del.className = "ibtn"; del.title = "Olvidar esto"; del.innerHTML = icon("close", 1);
    del.onclick = () => {
      memory = memory.filter((x) => x.id !== m.id); saveMemory(); renderMemory();
      Sfx.pop(); express({ eyes: "closed", mouth: "flat" }, 500); say("Olvidado", 1000, { sound: false });
    };
    it.append(tx, del); memList.append(it);
  }
}
function openMemory() {
  if (curMode === "mini") setMode("full");
  winEl.classList.remove("skins", "life");
  winEl.classList.add("mem");
  renderMemory();
  Sfx.pop();
  express({ eyes: "happy", mouth: "smile" }, 700);

}
function closeMemory() { winEl.classList.remove("mem"); if (curMode === "full") promptEl.focus(); }
$("b-mem").onclick = () => (winEl.classList.contains("mem") ? closeMemory() : openMemory());
$("mem-back").onclick = closeMemory;
memTog.onclick = () => {
  memOn = !memOn; save("mochi.memOn", memOn ? "1" : "0"); renderMemory(); Sfx.pop();
  say(memOn ? "¡Memoria activada!" : "Vale, no guardaré nada nuevo", 1500);
};
function addManual() {
  const t = cleanMem(memNew.value);
  if (!t) {
    if (memNew.value.trim()) { express({ eyes: "angry", mouth: "flat" }, 900); say(SECRET_RE.test(memNew.value) ? "Eso parece un dato secreto: mejor no lo guardo" : "Escríbelo un poco más claro", 2000); }
    return;
  }
  if (isDuplicate(t)) { say("¡Eso ya lo sabía!", 1400); memNew.value = ""; return; }
  memory.push({ id: newId(), text: t, created: Date.now() });
  while (memory.length > MEMORY_MAX) memory.shift();
  saveMemory(); memNew.value = ""; renderMemory();
  Sfx.chime(); express({ eyes: "happy", mouth: "smile", blush: 2 }, 800); say("¡Apuntado!", 1200);
}
$("mem-add").onclick = addManual;
memNew.addEventListener("keydown", (e) => { if (e.key === "Enter") addManual(); });
let clearArmed = null;
memClear.onclick = () => {
  if (!memory.length) return;
  if (!clearArmed) {
    memClear.textContent = "¿SEGURO?";
    clearArmed = setTimeout(() => { clearArmed = null; memClear.textContent = "BORRAR TODO"; }, 3000);
    return;
  }
  clearTimeout(clearArmed); clearArmed = null; memClear.textContent = "BORRAR TODO";
  memory = []; saveMemory(); renderMemory();
  Sfx.sad(); express({ eyes: "dizzy", mouth: "wavy" }, 1200); say("¿Quién soy? ¿Dónde estoy? ...es broma, ya lo he olvidado todo", 2600);
};

async function loadModels() {
  try {
    const r = await fetch(OLLAMA + "/api/tags");
    const data = await r.json();
    const names = (data.models || []).map((m) => m.name);
    modelSel.innerHTML = "";
    if (!names.length) throw new Error("sin modelos");
    names.forEach((n) => modelSel.add(new Option(n, n)));
    const saved = load("mochi.model");
    if (saved && names.includes(saved)) modelSel.value = saved;
    statusEl.className = "on";
    return true;
  } catch (e) {
    statusEl.className = "off";
    modelSel.innerHTML = "<option>sin modelo</option>";
    return false;
  }
}
modelSel.addEventListener("change", () => { save("mochi.model", modelSel.value); checkModelHint(); });

function localReply(userText, reply) {

  addMsg("pet", reply);
  history.push({ role: "assistant", content: reply });
  persist();
  LF.msgs++; Life.addXp(1); Life.bump("love", 1);
}
async function send(forced) {
  if (controller) { controller.abort(); return; }
  const text = (forced && forced.text) || promptEl.value.trim();
  const shown = (forced && forced.shown) || text;
  if (!text) return;
  if (!forced) promptEl.value = "";
  chipsEl.textContent = "";
  if (forced) ctxItem = null;
  touch(); wakeUp(true); cancelActs();
  stopSpeaking();
  if (!forced) {
    const local = handleCommand(text);
    if (local != null) return localReply(text, local);
  }

  if (statusEl.className !== "on" && !(await loadModels())) {
    sysMsg("No encuentro Ollama o no tiene ningún modelo. Comprueba que está abierto y que has descargado un modelo.", true);
    express({ eyes: "sad", mouth: "sad" }, 2000);
    return;
  }

  addMsg("user", shown);
  history.push(forced ? { role: "user", content: text, shown } : { role: "user", content: text });
  Sfx.pop();
  earsFor(-1, -1, 500);
  express({ eyes: "wide", mouth: "o" }, 280);
  KB.userUntil = 0;
  if (!forced) reactToUserText(text);
  // El nombre se capta al instante, sin esperar al evaluador
  const qn = memOn && !forced ? quickName(text) : null;
  if (qn) rememberName(qn);

  const line = document.createElement("div"); line.className = "line pet";
  const av = document.createElement("div"); av.className = "avatar";
  const bubbleMsg = document.createElement("div"); bubbleMsg.className = "msg pixbox";
  const typing = document.createElement("span"); typing.className = "typing"; typing.innerHTML = "<i></i><i></i><i></i>";
  bubbleMsg.append(typing); line.append(av, bubbleMsg); log.append(line); log.scrollTop = log.scrollHeight;

  P.mode = "think"; P.modeSince = now(); P.nextSweat = 0;
  say("Hmm", 0, { thought: true });
  controller = new AbortController();
  setSending(true);
  let reply = "", rafPending = false;
  const paint = () => { rafPending = false; renderRich(bubbleMsg, reply); log.scrollTop = log.scrollHeight; };

  try {
    // Si aún se está guardando algo de un mensaje anterior, espera (máx. 8 s) para responder ya con ello
    await Promise.race([memQueue, wait(8000)]);
    if (controller.signal.aborted) throw new DOMException("cancelado", "AbortError");
    const res = await fetch(OLLAMA + "/api/chat", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: modelSel.value,
        stream: true,
        messages: buildChatMessages(),
      }),
    });
    if (!res.ok) throw new Error(`Ollama respondió ${res.status}: ${await res.text()}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!ln) continue;
        const obj = JSON.parse(ln);
        if (obj.error) throw new Error(obj.error);
        const piece = (obj.message && obj.message.content) || "";
        if (piece) {
          if (!reply) { P.mode = "talk"; KB.ai = true; hideBubble(); }
          reply += piece;
          P.talkLevel = 1;
          if (!rafPending) { rafPending = true; requestAnimationFrame(paint); }
        }
      }
    }
    if (reply) {
      paint();
      history.push({ role: "assistant", content: reply });
      persist();
      express({ eyes: "happy", mouth: "smile" }, 700);
      burst("spark", 20, 4, 2, 12, 12);
      if (reply.length > 700) {
        setTimeout(() => { springs.sx.t = 1.1; springs.sy.t = 0.9; express({ eyes: "happy", mouth: "yawn" }, 900); say("¡Uf, cuánto he escrito!", 1600); }, 500);
        setTimeout(() => { springs.sx.t = 1; springs.sy.t = 1; }, 1400);
      } else if (Math.random() < 0.25) say(pick(["¡Listo! ♥", "¡Ahí lo tienes!", "¡Espero que te sirva!"]), 1500);
      if (!forced) queueMemory(text, reply);
      Life.chatted(); reactToReply(reply); speakText(reply);
    } else { bubbleMsg.textContent = "(sin respuesta)"; }
  } catch (e) {
    if (e.name === "AbortError") {
      if (reply) { paint(); bubbleMsg.append(" …"); history.push({ role: "assistant", content: reply }); persist(); }
      else bubbleMsg.textContent = "(cancelado)";
      express({ eyes: "open", mouth: "flat" }, 800);
      hideBubble();
    } else {
      bubbleMsg.classList.add("err");
      bubbleMsg.textContent = "Ay, algo falló: " + e.message;
      statusEl.className = "off";
      express({ eyes: "sad", mouth: "sad" }, 2600);
      floatUp("drop", 13, 18, { vy: 10, vx: -2, wob: 0, life: 1 });

      Sfx.sad();
      say(pick(["Ay... algo salió mal", "Snif... no me ha ido bien"]), 2200);
    }
  } finally {
    controller = null;
    P.mode = "idle"; P.talkLevel = 0; KB.ai = false;
    setSending(false);
    if (bubbleKind === "thought") hideBubble();
  }
}

async function pullModel(name) {
  showSetup({ text: `Descargando mi modelo (${name})...`, progress: 0, label: "Conectando..." });
  const layers = {};
  try {
    const res = await fetch(OLLAMA + "/api/pull", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: name, name: name, stream: true }),
    });
    if (!res.ok || !res.body) throw new Error(`Ollama respondió ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const ln = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!ln) continue;
        const o = JSON.parse(ln);
        if (o.error) throw new Error(o.error);
        if (o.digest && o.total) layers[o.digest] = { total: o.total, completed: o.completed || 0 };
        const vals = Object.values(layers);
        const tot = vals.reduce((a, l) => a + l.total, 0);
        const cmp = vals.reduce((a, l) => a + l.completed, 0);
        if (tot) {
          const pct = (100 * cmp) / tot;
          showSetup({ text: `Descargando mi modelo (${name})...`, progress: pct, label: `${mb(cmp)} / ${mb(tot)} MB (${Math.floor(pct)}%)` });
        } else barLabel.textContent = o.status || "";
      }
    }
    save("mochi.model", name);
    if (!(await loadModels())) throw new Error("El modelo no aparece tras la descarga.");
    Sfx.chime();
    express({ eyes: "heart", mouth: "smile", blush: 2 }, 1600);
    burst("heartS", 20, 4, 5, 18, 20);
    await enterChat();
  } catch (e) {
    showError(e.message, () => pullModel(name));
  }
}

/* ---- Temporizadores y pomodoro ---- */
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  const two = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${two(m)}:${two(r)}` : `${two(m)}:${two(r)}`;
}
function fmtDur(ms) {
  const s = Math.round(ms / 1000);
  if (s < 90) return s + " s";
  const m = Math.round(s / 60);
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " h" + (r ? " " + r + " min" : "");
}
const NUMW = { un: 1, una: 1, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, quince: 15, veinte: 20, treinta: 30 };
function parseDuration(text) {
  let rest = text, total = 0, found = false;
  const cut = (re, fn) => { rest = rest.replace(re, (...a) => { found = true; total += fn(...a); return " "; }); };
  cut(/\bmedia hora\b/i, () => 30 * 60e3);
  cut(/\bun cuarto de hora\b/i, () => 15 * 60e3);
  cut(/(\d+(?:[.,]\d+)?|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince|veinte|treinta)\s*(horas?|hs?|minutos?|mins?|m|segundos?|segs?|s)(\s*y\s*medi[ao])?(?![a-zA-Záéíóúñ])/gi, (_, n, u, half) => {
    const v = NUMW[n.toLowerCase()] ?? parseFloat(n.replace(",", "."));
    const c = u[0].toLowerCase();
    const unit = c === "h" ? 3600e3 : c === "s" ? 1e3 : 60e3;
    return v * unit + (half ? unit / 2 : 0);
  });
  if (!found || !(total >= 5000)) return null;
  return { ms: Math.min(total, 24 * 3600e3), rest };
}
const LEAD_RE = /^(?:[\s,.:;¡!¿?-]+|(?:av[ií]same|recu[eé]rdame|ponme|pon|programa|activa|despi[eé]rtame|un|una|el|temporizador|alarma|aviso|cuenta atr[aá]s|en|dentro de|de|para|que|a|por favor)(?![a-záéíóúñ]))/i;
function cleanLabel(s) {
  let x = s.replace(/\s+/g, " ").trim();
  for (let i = 0; i < 12 && x && LEAD_RE.test(x); i++) x = x.replace(LEAD_RE, "");
  x = x.replace(/\s+(?:en|dentro de|de|por)\s*$/i, "").replace(/[\s,.:;-]+$/, "");
  return x.slice(0, 40);
}
function timerFromText(args) {
  let d = parseDuration(args);
  if (!d) {
    const m = args.match(/^\s*(\d+(?:[.,]\d+)?)\s*(.*)$/);
    if (!m) return null;
    const ms = parseFloat(m[1].replace(",", ".")) * 60e3;
    if (!(ms >= 5000)) return null;
    d = { ms: Math.min(ms, 24 * 3600e3), rest: m[2] };
  }
  return { ms: d.ms, label: cleanLabel(d.rest) };
}
function addTimer(ms, label) {
  const t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), end: Date.now() + ms, label: label || "", total: ms };
  LF.timers.push(t); saveLife(); updateChip();
  return t;
}
function cancelTimer(id) { LF.timers = LF.timers.filter((t) => t.id !== id); saveLife(); updateChip(); }
function notifyUser(title, body) {

}
function ringAlarm(sayText, body) {

  express({ eyes: "wide", mouth: "o" }, 900);

  const chip = $("timerchip"); chip.classList.add("ring"); setTimeout(() => chip.classList.remove("ring"), 4500);
  say(sayText, 4500);

}

  ringAlarm(t.label ? `¡${t.label}!` : "¡Tiempo!", `Tu temporizador de ${fmtDur(t.total)} ha terminado` + (t.label ? ": " + t.label : "."));
}
const POMO = { work: 25, rest: 5, long: 15 };
function startPomo() {

const pomoWork = () => !!(LF.pomo && LF.pomo.phase === "work");
function tickTimers(nowMs) {
  let changed = false;
  for (let i = LF.timers.length - 1; i >= 0; i--) {

    if (nowMs >= t.end) { LF.timers.splice(i, 1); changed = true; fireTimer(t); }

    txt = fmtClock(t.end - nowMs) + (LF.timers.length > 1 ? " +" + (LF.timers.length - 1) : "");
  }
  if (chip.textContent !== txt) chip.textContent = txt;
  chip.classList.toggle("show", !!txt);

async function readDroppedFile(f) {
  const known = TEXT_EXT.test(f.name) || (f.type || "").startsWith("text/") || /json|xml|javascript/.test(f.type || "");
  if (!known && /^(image|audio|video)\//.test(f.type || "")) return { err: "Las imágenes, el audio y el vídeo aún no los sé leer" };
  if (f.size > 400 * 1024) return { err: "Uf, es muy grande para mí (máximo ~400 KB)" };
  let text = "";
  try { text = await f.text(); } catch { return { err: "No he podido leerlo..." }; }
  if (!known && (text.includes("\u0000") || (text.match(/\uFFFD/g) || []).length > 8)) return { err: "Solo sé leer archivos de texto y código (nada de PDF, Word o imágenes)" };

function renderLife() {
